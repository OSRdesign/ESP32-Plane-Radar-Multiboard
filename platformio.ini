[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:core2]
board = m5stack-core2
build_flags = -DBOARD_CORE2
lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
    bblanchon/ArduinoJson@^7

[env:cyd]
board = esp32dev
board_build.partitions = huge_app.csv  ; no OTA; frees flash headroom
build_flags = -DBOARD_CYD
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7

; CYD variant: ST7789 panel (same pins) - the common 2-USB-port board
[env:cyd_st7789]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DCYD_ST7789

; CYD variant: ILI9341 with inverted colours
[env:cyd_invert]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DCYD_INVERT

